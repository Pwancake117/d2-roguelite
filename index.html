<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 Roguelite Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: status strip on top, loadout left / event console right, Bungie panel above, history below. Single dark theme by choice: a game companion screen. */
  --bg:#0a0e15;
  --panel:#111824;
  --panel-2:#16202f;
  --line:#243247;
  --ink:#e4ebf5;
  --muted:#8796ac;
  --accent:#7fd4ff;
  --danger:#ff5d5d;
  --good:#5fe39a;
  --r-common:#c9c9c9; --r-uncommon:#4f9d5d; --r-rare:#5b8fd0; --r-legendary:#9b6bc4; --r-exotic:#e2c044;
  --e-arc:#79e6f2; --e-solar:#ff8a3d; --e-void:#b48cf0; --e-stasis:#5a8cff; --e-strand:#3fe07a; --e-prismatic:#ff7fd8;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:1rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.45rem;text-transform:uppercase;letter-spacing:.08em}
.brand span{color:var(--muted);font-size:.85rem}
.sync{font-family:var(--mono);font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--danger)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:14px;align-content:start}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.85rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04121c;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:#5a2a2a;color:#ffb3b3}
.btn.danger:hover{border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.field{display:grid;gap:4px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
select,input[type=text],textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.95rem;text-transform:none;letter-spacing:0}
textarea{width:100%;font-family:var(--mono);font-size:.8rem;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;background:var(--panel-2);font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.04em}
.seg input:checked + label{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:#fff}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.el-arc{--el:var(--e-arc)} .el-solar{--el:var(--e-solar)} .el-void{--el:var(--e-void)} .el-stasis{--el:var(--e-stasis)} .el-strand{--el:var(--e-strand)} .el-prismatic{--el:var(--e-prismatic)}
.seg label.elem{border-left:3px solid var(--el)}
/* status strip */
.status{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.status > div{background:var(--panel);padding:12px 14px;display:grid;gap:2px;align-content:center}
.status .who{border-left:4px solid var(--el);min-width:190px}
.status .who b{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em}
.status .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.status .val{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:820px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}.status .who{grid-column:1/-1}}
.pips{display:flex;gap:5px;align-items:center;height:1.9rem}
.pip{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--accent)}
.pip.on{background:var(--accent)}
.pip.lost{border-color:#4a2424;background:#2a1414}
.meter{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:linear-gradient(90deg,#3b8fc0,var(--accent))}
/* loadout */
.slotgroup{display:grid;gap:6px}
.items{display:grid;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--rc,var(--line));border-radius:4px;padding:7px 10px}
.item .nm{font-weight:500}
.item .meta{font-size:.75rem;color:var(--muted);margin-left:auto;text-align:right}
.r-common{--rc:var(--r-common)} .r-uncommon{--rc:var(--r-uncommon)} .r-rare{--rc:var(--r-rare)} .r-legendary{--rc:var(--r-legendary)} .r-exotic{--rc:var(--r-exotic)}
.rtag{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--rc);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:3px;padding:4px 9px;font-size:.85rem}
.chip.el{border-left:3px solid var(--el)}
.chip.empty{color:var(--muted);border-style:dashed}
.pickchip{cursor:pointer;font:inherit;color:inherit;font-size:.85rem}
.pickchip.on{background:color-mix(in srgb, var(--el) 22%, var(--panel-2));border-color:var(--el);color:#fff}
.basebuild{border:1px solid var(--line);border-left:4px solid var(--el);border-radius:4px;padding:12px;display:grid;gap:8px;background:var(--panel-2)}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;max-width:75ch;font-size:.9rem;color:var(--ink)}
.steps b{color:#fff}
.bungie{border-color:#2d4a63}
.blog{margin:0;padding-left:18px;font-size:.85rem;color:var(--muted);display:grid;gap:2px}
.blog .ok{color:var(--good)} .blog .err{color:#ffb3b3}
.chip.warn{border-color:#6a3a3a;color:#ffb3b3}
.tog{display:flex;gap:6px;align-items:center;font-size:.85rem;cursor:pointer}
.guide summary{cursor:pointer;list-style-position:outside}
.guidecols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.guidecols ul.steps{list-style:disc}
.callout.dungeon{border-color:#7a5cff;background:rgba(122,92,255,.08)}
.btn.big{padding:12px 22px;font-size:1rem}
.where{margin-left:6px;padding:1px 6px;border-radius:3px;font-size:.6rem;letter-spacing:.06em;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.where.w-postmaster,.where.w-other-postmaster{border-color:#8a6a1c;color:#f3c969}
.where.w-gone{border-color:#6a3a3a;color:#ffb3b3}
.where.w-equipped{border-color:#2f6b4b;color:var(--good)}
.empty-note{color:var(--muted);font-size:.85rem}
/* reward cards */
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.offer{background:var(--panel-2);border:1px solid var(--line);border-top:4px solid var(--rc,var(--accent));border-radius:4px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.offer:hover{border-color:var(--rc,var(--accent));transform:translateY(-1px)}
.offer .nm{font-family:var(--display);font-weight:600;font-size:1rem}
.offer .sub{font-size:.78rem;color:var(--muted)}
.offer.boon{--rc:var(--el)}
.callout{border:1px solid var(--accent);background:rgba(127,212,255,.06);border-radius:6px;padding:14px;display:grid;gap:10px}
.callout.dead{border-color:var(--danger);background:rgba(255,93,93,.07)}
/* log */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tablewrap{overflow-x:auto;max-height:340px;overflow-y:auto}
.res{font-family:var(--display);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:3px;white-space:nowrap}
.res.clear{background:rgba(95,227,154,.12);color:var(--good)}
.res.flawless{background:rgba(226,192,68,.15);color:var(--r-exotic)}
.res.death{background:rgba(255,93,93,.14);color:var(--danger)}
.res.extracted{background:rgba(127,212,255,.14);color:var(--accent)}
.dimstr{font-family:var(--mono);font-size:.78rem;background:#070a10;border:1px solid var(--line);border-radius:4px;padding:10px;word-break:break-word;color:#bfe9ff}
.help{color:var(--muted);font-size:.85rem;max-width:65ch}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--accent);color:#04121c;font-weight:600;padding:8px 16px;border-radius:4px;font-family:var(--display);letter-spacing:.04em;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px;z-index:5}
.modal .panel{max-width:640px;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.offer:hover{transform:none}}
</style>
</head>

let db=null, userId=null, downloads=null, saving=false, dirty=false;
function setSync(kind, text){ const el=$("#sync"); el.className="sync "+(kind||""); el.querySelector("span").textContent=text; }
function save(){

  dirty = true; flush();

async function flush(){
  if(!db || !userId || saving) return;
  saving = true;
  while(dirty){
    dirty = false;
    try { await db.doc("data/users/"+userId+"/state").set({json:JSON.stringify(state), updatedAt:state.updatedAt}); setSync("ok","Saved to your account"); }
    catch(e){
      if(e && e.code==="quota_exceeded") setSync("err","Account storage full: export and clear old runs");
      else if(e && e.code==="invalid_argument"){ setSync("","Saved on this device"); db=null; break; }
      else setSync("err","Couldn't reach your account; saved on this device");
      break;
    }
  }
  saving = false;
}
async function initCapabilities(){
  if(!window.claude || typeof window.claude.use!=="function") return;
  try { downloads = await window.claude.use("downloads"); } catch(e){ downloads=null; }
  try {
    const [d,u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!d || !u) return;
    const id = await u.id(); if(!id) return;
    db = d; userId = id;
    setSync("","Syncing…");
    const timer = setTimeout(()=>setSync("err","Account not reachable yet; saved on this device"),10000);
    const snap = await db.doc("data/users/"+userId+"/state").get();
    clearTimeout(timer);
    let remote = null;
    if(snap.exists){ try { remote = JSON.parse(snap.data().json); } catch(e){} }
    if(remote && (remote.updatedAt||0) > (state.updatedAt||0)){
      state = Object.assign({run:null,history:[],updatedAt:0}, remote); normalize();
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
      render();
      setSync("ok","Saved to your account");
    } else if(state.updatedAt && (!remote || state.updatedAt > (remote.updatedAt||0))){
      dirty = true; flush();
    } else setSync("ok","Saved to your account");
  } catch(e){ setSync("","Saved on this device"); }
}

/* ---------------- Run logic ---------------- */
function rollRarity(power){
  const o = ODDS[Math.min(7,Math.max(1,power))];
  return weighted(RARITIES.map((r,i)=>({r,w:o[i]}))).r;
}
function slotOf(w){ return w.slot || (w.ammo==="heavy" ? "power" : "kinetic"); }
function ownedKey(it){ return it.kind==="armor" || it.rarity==="exotic" ? "x:"+it.name : it.rarity+":"+it.dim+":"+it.ammo+":"+slotOf(it); }
/* slot: kinetic | energy | power. Primary/special go in kinetic or energy; heavy goes in power. */
function makeWeapon(rarity, ammo, slot, excludeDims){
  if(rarity==="exotic"){
    const pool = EXOTIC_WEAPONS.filter(([n,a,sl])=>(!ammo || a===ammo) && (!slot || sl===slot));
    const [name,a,sl] = pick(pool);
    return {id:uid6(),kind:"weapon",rarity,name,ammo:a,slot:sl};
  }
  const types = WEAPON_TYPES.filter(w=>(!ammo || w.ammo===ammo) && !(excludeDims||[]).includes(w.dim));
  const t = pick(types);
  const sl = t.ammo==="heavy" ? "power" : (slot && slot!=="power" ? slot : pick(["kinetic","energy"]));
  return {id:uid6(),kind:"weapon",rarity,dim:t.dim,name:t.label,ammo:t.ammo,slot:sl};
}
function lootOffers(run, power){
  const owned = new Set(run.weapons.concat(run.armor).map(ownedKey));
  const offers=[], seen=new Set();
  let guard=0;
  while(offers.length<3 && guard++<60){
    const rarity = rollRarity(power);
    let it;
    if(rarity==="exotic" && Math.random()<0.4){
      const pool = EXOTIC_ARMOR[run.cls].filter(n=>!owned.has("x:"+n));
      if(!pool.length) continue;
      it = {id:uid6(),kind:"armor",rarity,name:pick(pool),cls:run.cls};
    } else {
      const ammo = weighted([{a:"primary",w:50},{a:"special",w:30},{a:"heavy",w:20}]).a;
      it = makeWeapon(rarity, ammo);
    }
    const k = ownedKey(it);
    if(owned.has(k) || seen.has(k)) continue;
    seen.add(k); offers.push(it);
  }
  return offers;
}
function fragSlots(run){ return run.ab.aspects.length*2 + run.ab.fragBonus; }
function boonOffers(run){
  const a = run.ab, c = run.cls, e = run.el, cands = [];
  const add = (type,label,list,w) => list.forEach(name=>cands.push({type,label,name,w}));
  add("grenade","Grenade",P.grenades(c,e).filter(n=>!a.grenades.includes(n)),3);
  add("melee","Melee",P.melees(c,e).filter(n=>!a.melees.includes(n)),3);
  add("super","Super",P.supers(c,e).filter(n=>!a.supers.includes(n)),2);
  add("classAbility","Class Ability",P.classAbilities(c,e).filter(n=>!a.classAbilities.includes(n)),2);
  if(a.aspects.length<2) add("aspect","Aspect",P.aspects(c,e).filter(n=>!a.aspects.includes(n)),5);
  if(a.fragments.length<fragSlots(run)) add("fragment","Fragment",P.fragments(c,e).filter(n=>!a.fragments.includes(n)),2);
  if(a.aspects.length>0 && fragSlots(run)<6) cands.push({type:"fragslot",label:"Fragment Slot",name:"+1 Fragment Slot",w:4});
  if(run.lives<run.maxLives+1) cands.push({type:"life",label:"Revive Token",name:"+1 Life",w:2});
  const out=[], pool=cands.slice();
  // spread across types: weight each type once, then pick a name inside it
  while(out.length<3 && pool.length){
    const types = {}; pool.forEach(o=>{ (types[o.type] = types[o.type]||[]).push(o); });
    const typeList = Object.keys(types).filter(t=>!out.some(o=>o.type===t));
    const useList = typeList.length ? typeList : Object.keys(types);
    const t = weighted(useList.map(t=>({t,w:types[t][0].w}))).t;
    const choice = pick(types[t]);
    out.push(choice);
    pool.splice(pool.indexOf(choice),1);
  }
  return out;
}

function logEventData(x, noRender){

  const outcome = flawless ? "flawless" : completed ? "clear" : "death";
  const entry = {n:run.events.length+1, at:x.at||Date.now(), eventId:ev.id, event:ev.name, diff, diffName:DIFFS[diff], power, outcome, deaths, note:x.note||"", source:x.instanceId?"bungie":"manual",
    loot:(x.loot&&x.loot.length)?x.loot.join(", "):null, boons:[], lost:null, lifeLost:false, lightBefore:run.light, scoreBefore:run.score, lightGain:0};
  if(ev.id==="dungeon" && run.dungeon){ entry.note = (entry.note?entry.note+" · ":"")+run.dungeon.encounters+" encounter"+(run.dungeon.encounters===1?"":"s")+" cleared"; run.dungeon = null; }
  run.events.push(entry);
  run.deaths += deaths;
  // rewards for finishing
  if(completed){
    run.depth++;
    const gain = flawless ? power + FLAWLESS_LIGHT : hardcore ? power : Math.max(1, power - deaths);
    entry.lightGain = gain;
    run.light += gain;
    run.score += power*10 + (flawless ? FLAWLESS_SCORE : -Math.min(power*10, 5*deaths));
  }
  // penalties
  let loseLife = false;
  if(hardcore && deaths>0){
    loseLife = true;
    const eq = new Set(x.equippedLoot || run.weapons.concat(run.armor).filter(i=>i.inst).map(i=>i.inst));
    const gone = run.weapons.concat(run.armor).filter(i=>i.inst && eq.has(i.inst));
    if(gone.length){
      run.lostLoot = (run.lostLoot||[]).concat(gone.map(g=>g.inst));
      run.weapons = run.weapons.filter(w=>!gone.includes(w)); run.armor = run.armor.filter(a=>!gone.includes(a));
      entry.lost = gone.map(g=>g.name).join(", ");
    }
  } else if(!hardcore && !completed){
    loseLife = true; // a failed run or a wipe that ends the activity
  }
  if(loseLife){ run.lives--; entry.lifeLost = true; }
  if(run.lives<=0){ endRun("death"); }
  else {
    let boonCount = 0;
    while(run.light >= LIGHT_PER_BOON){ run.light -= LIGHT_PER_BOON; boonCount++; }
    run.pending = boonCount ? {eventN:entry.n, loot:[], boonsLeft:boonCount, boon:boonOffers(run)} : null;
  }
  if(!noRender){ save(); afterChange(); render(); }
}
/* events synced from Bungie wait in a queue; each one is logged when the previous rewards are picked */
function processQueue(){
  const run = state.run; if(!run || run.status!=="active") return false;
  let did = false;
  while(run.status==="active" && !run.pending && run.queue && run.queue.length){
    logEventData(run.queue.shift(), true); did = true;
  }
  return did;
}
let applyTimer = null;
function afterChange(){
  if(processQueue()) save();
  const B = window.D2R_BUNGIE, run = state.run;
  if(!B || !B.connected() || !B.opts.autoEquip || !run || run.status!=="active" || run.pending) return;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(()=>{ B.pickChar(run); B.applyRun(run, {quiet:true}); }, 800);
}
/* Dungeon runs: each encounter cleared gives a loot pick and a guaranteed ability pick. */
function encounterCleared(){
  const run = state.run; if(!run || run.mode!=="dungeon" || run.pending || run.status!=="active") return;
  const B = window.D2R_BUNGIE, cur = B && B.current;
  const dname = cur ? cur.name : (run.dungeon && run.dungeon.name) || "Dungeon";
  if(!run.dungeon || run.dungeon.name!==dname || (cur && run.dungeon.started!==cur.started)) run.dungeon = {name:dname, started:cur?cur.started:Date.now(), encounters:0};
  run.dungeon.encounters++;
  const diff = cur ? cur.diff : 0, power = DUNGEON_EVENT.tier + diff;
  const entry = {n:run.events.length+1, at:Date.now(), eventId:"encounter", event:"Encounter "+run.dungeon.encounters+" · "+dname, diff, diffName:DIFFS[diff], power, outcome:"clear", note:"", source:"encounter", loot:null, boons:[], lost:null, lightBefore:run.light};
  run.events.push(entry);
  run.depth++; run.score += power*10;
  run.pending = {eventN:entry.n, loot:[], boonsLeft:1, boon:boonOffers(run)};
  save(); render();
}
function itemLabel(it){ return it.kind==="armor" || it.rarity==="exotic" ? it.name : cap(it.rarity)+" "+it.name; }
function takeLoot(i){
  const run = state.run, p = run.pending; if(!p) return;
  const ev = run.events.find(e=>e.n===p.eventN);
  if(i>=0){
    const it = p.loot[i]; it.source = ev ? ev.event : "Event";
    (it.kind==="armor" ? run.armor : run.weapons).push(it);
    if(ev) ev.loot = itemLabel(it);
  } else if(ev) ev.loot = "Skipped";
  p.loot = [];
  if(!p.boonsLeft) run.pending = null;
  save(); afterChange(); render();
}
function takeBoon(i){
  const run = state.run, p = run.pending; if(!p || !p.boon) return;
  const b = p.boon[i], a = run.ab;
  const map = {grenade:"grenades",melee:"melees",super:"supers",classAbility:"classAbilities",aspect:"aspects",fragment:"fragments"};
  if(map[b.type]){ a[map[b.type]].push(b.name); if(a.active && b.type in a.active) a.active[b.type] = b.name; }
  else if(b.type==="fragslot") a.fragBonus++;
  else if(b.type==="life") run.lives++;
  run.boons++; run.score += 5;
  const ev = run.events.find(e=>e.n===p.eventN); if(ev) ev.boons.push(b.label+": "+b.name);
  p.boonsLeft--;
  p.boon = p.boonsLeft>0 ? boonOffers(run) : null;
  if(!p.boonsLeft && !p.loot.length) run.pending = null;
  save(); afterChange(); render();
}
function endRun(result){
  const run = state.run; if(!run) return;
  run.status = result; run.endedAt = Date.now(); run.pending = null;
  if(result==="extracted"){ run.score += run.depth*5; }
  const highest = run.events.filter(e=>e.outcome==="clear").reduce((m,e)=>Math.max(m,e.diff),-1);
  state.history.unshift({
    id:run.id, mode:run.mode||"ops", cls:run.cls, el:run.el, startedAt:run.startedAt, endedAt:run.endedAt, result, depth:run.depth, deaths:run.deaths,
    score:run.score, boons:run.boons, highestDiff: highest>=0 ? DIFFS[highest] : "None", events:run.events,
    finalLoadout:{weapons:run.weapons.map(itemLabel), armor:run.armor.map(a=>a.name), abilities:run.ab}
  });
  state.history = state.history.slice(0,30);
}
function undoLast(){
  // only for the newest event with no reward taken yet (mistake fix)
  const run = state.run; if(!run || !run.events.length) return;
  const ev = run.events[run.events.length-1];
  if(!run.pending || run.pending.eventN!==ev.n || ev.boons.length) return;
  run.events.pop(); if(ev.outcome!=="death") run.depth--; run.score = ev.scoreBefore ?? (run.score - ev.power*10); run.deaths -= ev.deaths||0; if(ev.lifeLost) run.lives++;
  run.light = ev.lightBefore ?? 0;
  run.pending = null;
  save(); render(); toast("Last event removed");
}

/* Subclass plan: subclass hash + socket index -> plug hash for the active abilities, aspects and fragments. */
const CLASS_TYPE = {Titan:0, Hunter:1, Warlock:2};
function fragmentCap(run){ return Math.min(fragSlots(run), 6); }
function dimLoadout(run){
  const c = run.cls, e = run.el, a = run.ab, act = a.active || {};
  const prism = e==="prismatic";
  const so = {};
  const put = (idx, type, name) => { const h = plugHash(c,e,type,name); if(h) so[idx] = h; };
  put(0,"classAbility",act.classAbility); put(2,"super",act.super); put(3,"melee",act.melee); put(4,"grenade",act.grenade);
  const aspIdx = prism ? [7,8] : [5,6], fragStart = prism ? 9 : 7;
  a.aspects.slice(0,2).forEach((n,i)=>put(aspIdx[i],"aspect",n));
  a.fragments.slice(0,fragmentCap(run)).forEach((n,i)=>put(fragStart+i,"fragment",n));
  const name = ("D2R "+ELEMENTS[e].name+" "+c+" D"+run.depth).slice(0,40);
  return {
    name, classType:CLASS_TYPE[c], clearSpace:false,
    equipped:[{id:"12345", hash:KIT[c][e].hash, socketOverrides:so}],
    unequipped:[]
  };
}

/* ---------------- Export ---------------- */
function csvEscape(v){ v = String(v ?? ""); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function buildCSV(runs){
  const head = ["run_id","class","subclass","run_result","event_no","time","event","difficulty","power","outcome","loot","boons","lost_item","note"];
  const rows = [head.join(",")];
  runs.forEach(r=>r.events.forEach(e=>rows.push([r.id,r.cls,ELEMENTS[r.el].name,r.result||r.status,e.n,new Date(e.at).toISOString(),e.event,e.diffName,e.power,e.outcome,e.loot||"",(e.boons||[]).join(" | "),e.lost||"",e.note||""].map(csvEscape).join(","))));
  return rows.join("\n");
}
function allRuns(){ const list = state.history.slice(); if(state.run && state.run.status==="active") list.unshift(Object.assign({result:"active"},state.run)); return list; }
async function exportFile(kind){
  const runs = allRuns();
  if(!runs.length){ toast("No runs to export yet"); return; }
  const stamp = new Date().toISOString().slice(0,10);
  const filename = kind==="csv" ? "d2-roguelite-events-"+stamp+".csv" : "d2-roguelite-runs-"+stamp+".json";
  const text = kind==="csv" ? buildCSV(runs) : JSON.stringify({exportedAt:new Date().toISOString(), runs}, null, 2);
  if(downloads){
    try { await downloads.save({filename, data:text}); return; }
    catch(e){
      try { await downloads.save({filename, data:new Blob([text],{type:kind==="csv"?"text/csv":"application/json"})}); return; } catch(e2){}
    }
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text],{type:kind==="csv"?"text/csv":"application/json"}));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000); return;
  } catch(e){}
  showText(filename, text);
}

    <div class="row between"><h2>Loadout pool</h2>${(()=>{ const B = window.D2R_BUNGIE; const n = B && B.profile ? run.weapons.concat(run.armor).filter(x=>x.inst && B.whereIs(x.inst)==="postmaster").length : 0;
      return n ? `<button class="btn" data-act="bPull" ${B.busy?"disabled":""}>Pull ${n} from Postmaster</button>` : ""; })()}</div>
    <p class="help" style="margin:0">You may equip anything listed here. Gear you pick up in game during the run is added automatically${run.ownedAtStart?"":" once Bungie is connected"}.</p>
    ${slot("kinetic")}${slot("energy")}${slot("power")}
    <div class="slotgroup"><h3>Armor</h3><div class="items">${itemRow({kind:"weapon",any:true,rarity:"common",name:"Any common "+run.cls+" armor",note:"Pull from Collections",source:"Starter"})}</div><h3>Looted armor</h3>${run.armor.length ? `<div class="items">${run.armor.map(itemRow).join("")}</div>` : `<div class="empty-note">Armor you pick up during the run appears here</div>`}</div>
    <p class="help" style="margin:0">Tap an unlocked ability to switch to it in game.</p>
    <div class="slotgroup"><h3>Super</h3>${pickList(run,"super")}</div>
    <div class="slotgroup"><h3>Grenade</h3>${pickList(run,"grenade")}</div>
    <div class="slotgroup"><h3>Melee</h3>${pickList(run,"melee")}</div>
    <div class="slotgroup"><h3>Class ability</h3>${pickList(run,"classAbility")}</div>
    <div class="slotgroup"><h3>Aspects (${a.aspects.length}/2)</h3>${chipList(a.aspects, run.el, "", 2)}</div>
    <div class="slotgroup"><h3>Fragments (${a.fragments.length}/${fragSlots(run)})</h3>${chipList(a.fragments, run.el, "Each aspect opens 2 fragment slots", fragSlots(run))}</div>
  </section>`;
}
function renderPending(run){
  const p = run.pending, ev = run.events.find(e=>e.n===p.eventN);
  let html = `<div class="callout"><div class="row between"><h2 style="color:var(--accent)">${ev && ev.outcome==="flawless"?"Flawless! ":""}Ability unlock: ${esc(ev?ev.event:"")} · ${esc(ev?ev.diffName:"")}</h2>${(!ev||ev.boons.length)?"":`<button class="btn ghost" data-act="undo">Undo event</button>`}</div>`;
  if(p.loot.length){
    html += `<h3>Choose one drop</h3><div class="offers">${p.loot.map((it,i)=>`<button class="offer r-${it.rarity}" data-act="loot" data-i="${i}"><span class="rtag">${it.rarity}</span><span class="nm">${esc(it.name)}</span><span class="sub">${it.kind==="armor"?"Exotic armor · "+run.cls:SLOT_LABEL[slotOf(it)]+" · "+AMMO_LABEL[it.ammo]+" ammo"}</span></button>`).join("")}</div>
      <div class="row"><button class="btn ghost" data-act="loot" data-i="-1">Leave it</button></div>`;
  }
  if(p.boon){
    html += `<h3>Ability unlocked: choose one${p.boonsLeft>1?` (${p.boonsLeft} picks left)`:""}</h3><div class="offers">${p.boon.map((b,i)=>`<button class="offer boon el-${run.el}" data-act="boon" data-i="${i}"><span class="rtag" style="color:var(--el)">${esc(b.label)}</span><span class="nm">${esc(b.name)}</span></button>`).join("")}</div>`;
  }
  return html + `</div>`;
}
function renderDungeonPanel(run){
  const B = window.D2R_BUNGIE, cur = B && B.current, d = run.dungeon;
  const live = cur ? `<b>In ${esc(cur.name)}</b>${cur.diff?` · ${esc(DIFFS[cur.diff])}`:""}` : (B && B.connected() ? "Not in a dungeon right now. The app checks every 20 seconds." : "Connect Bungie to detect dungeons automatically.");
  const n = d ? d.encounters : 0;
  return `<section class="callout dungeon">
    <div class="row between"><h2 style="color:var(--accent)">Dungeon tracker</h2><span class="help">${live}</span></div>
    <p style="margin:0">${d ? `${esc(d.name)}: <b>${n}</b> encounter${n===1?"":"s"} cleared this clear.` : "Tap the button after each encounter you beat (bosses and major fights). Each one gives an ability unlock; the gear you pick up in game is yours to use."}</p>
    <div class="row"><button class="btn primary big" data-act="encounter">Encounter cleared</button>
    <span class="help">When the dungeon ends, Bungie's record logs the clear, your deaths and your loot.</span></div>
  </section>`;
}
function renderEventForm(run){
  const list = eventsFor(run);
  return `${run && run.mode==="dungeon" ? renderDungeonPanel(run) : ""}<form id="evform" class="panel" style="background:var(--panel-2)">
    <h2>${run && run.mode==="dungeon" ? "Log a dungeon result by hand" : "Log an event"}</h2>
    <div class="row" style="gap:12px;align-items:end">
      <label class="field" for="event">Activity<select id="event" name="event">${list.map(e=>`<option value="${e.id}">${esc(e.name)} (tier ${e.tier})</option>`).join("")}</select></label>
      <label class="field" for="diff">Difficulty<select id="diff" name="diff">${DIFFS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select></label>
    </div>
    <div class="seg" role="radiogroup" aria-label="Outcome">
      <input type="radio" name="outcome" id="oc-flawless" value="flawless" checked><label for="oc-flawless">Cleared, no deaths</label>
      <input type="radio" name="outcome" id="oc-clear" value="clear"><label for="oc-clear">Cleared with deaths</label>
      <input type="radio" name="outcome" id="oc-fail" value="fail"><label for="oc-fail">Failed / wiped out</label>
      <label class="field" for="mdeaths" style="text-transform:none;letter-spacing:0">Deaths <input type="text" id="mdeaths" name="mdeaths" value="1" inputmode="numeric" style="width:56px"></label>
    </div>
    <label class="field" for="note">Note (optional)<input type="text" id="note" name="note" maxlength="140" placeholder="e.g. Fireteam Ops Quickplay, Master"></label>
    <div class="row"><button class="btn primary" type="submit">Log event</button><span class="help">Higher tier and difficulty roll better loot and more Light.</span></div>
  </form>`;
}
function renderEventLog(events){
  if(!events.length) return `<div class="empty-note">No events logged yet. Clear something in game, then log it here.</div>`;
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Event</th><th>Result</th><th>Reward / loss</th></tr></thead><tbody>
    ${events.slice().reverse().map(e=>`<tr><td class="num">${e.n}</td><td>${esc(e.event)}<br><span class="help">${esc(e.diffName)} · power ${e.power}${e.note?" · "+esc(e.note):""}</span></td>
    <td><span class="res ${e.outcome}">${e.outcome==="flawless"?"Flawless":e.outcome==="clear"?"Cleared":e.eventId==="encounter"?"Cleared":"Failed"}</span>${e.deaths?`<br><span class="help">${e.deaths} death${e.deaths>1?"s":""}</span>`:""}</td>
    <td>${esc([e.lightGain?"+"+e.lightGain+" Light":"", e.loot?"Looted "+e.loot:"", ...(e.boons||[]), e.lifeLost?"Lost a life":"", e.lost?"Lost "+e.lost:""].filter(Boolean).join(" · ")||"—")}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function renderHistory(){
  const h = state.history;
  return `<section class="panel">
    <div class="row between"><h2>Run history</h2><div class="row"><button class="btn" data-act="export" data-kind="csv">Export CSV</button><button class="btn" data-act="export" data-kind="json">Export JSON</button></div></div>
    ${h.length ? `<div class="tablewrap"><table><thead><tr><th>Ended</th><th>Run</th><th>Guardian</th><th>Result</th><th>Depth</th><th>Deaths</th><th>Top difficulty</th><th>Score</th><th>Length</th></tr></thead><tbody>
      ${h.map(r=>`<tr><td>${fmtTime(r.endedAt)}</td><td>${r.mode==="dungeon"?"Dungeon":"Vanguard Ops"}</td><td><span class="chip el el-${r.el}">${ELEMENTS[r.el].name} ${r.cls}</span></td><td><span class="res ${r.result}">${r.result==="death"?"Died":"Extracted"}</span></td><td class="num">${r.depth}</td><td class="num">${r.deaths}</td><td>${esc(r.highestDiff)}</td><td class="num">${r.score}</td><td class="num">${fmtDur(r.endedAt-r.startedAt)}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty-note">Finished runs show up here with depth, deaths and score. Exports include every event you logged.</div>`}
  </section>`;
}
function renderEnded(){
  const r = state.history[0]; if(!r) return "";
  const dead = r.result==="death";
  return `<section class="callout ${dead?"dead":""}">
    <h2 style="color:${dead?"var(--danger)":"var(--accent)"}">${dead?"Run over: your Light fades":"Extracted"}</h2>
    <p style="margin:0">${ELEMENTS[r.el].name} ${r.cls} reached depth <b>${r.depth}</b> with a score of <b>${r.score}</b> over ${r.events.length} events. Highest difficulty cleared: ${esc(r.highestDiff)}.</p>
    <div class="row"><button class="btn primary" data-act="dismiss">Set up next run</button><button class="btn" data-act="export" data-kind="csv">Export CSV</button></div>
  </section>`;
}
function render(){
  const run = state.run;
  let html = "";
  if(run && run.status==="active"){
    html += renderStatus(run);
    html += renderBungie(run);
    html += `<div class="grid2">${renderLoadout(run)}<section class="panel"><div style="display:grid;gap:14px">
      ${run.pending ? renderPending(run) : renderEventForm(run)}
      <h2>Event log</h2>${renderEventLog(run.events)}
      <div class="row" style="border-top:1px solid var(--line);padding-top:12px">
        ${ui.confirm==="extract" ? `<span>End the run and bank your score?</span><button class="btn primary" data-act="extract">Yes, extract</button><button class="btn ghost" data-act="cancel">Cancel</button>`
        : ui.confirm==="abandon" ? `<span>Abandon counts as a death. Sure?</span><button class="btn danger" data-act="abandon">Yes, abandon</button><button class="btn ghost" data-act="cancel">Cancel</button>`
        : `<button class="btn" data-act="ask" data-what="extract" ${run.pending?"disabled":""}>Extract (end run)</button><button class="btn danger" data-act="ask" data-what="abandon">Abandon</button>`}
      </div></div></section></div>`;
  } else if(run && run.status!=="active"){
    html += renderEnded();
  } else {
    html += renderBungie(null);
    html += renderSetup();
    html += renderGuide();
  }
  html += renderHistory();
  $("#app").innerHTML = html;
}

/* ---------------- Bungie panel ---------------- */
function renderBungie(run){
  const B = window.D2R_BUNGIE; if(!B) return "";
  const logHtml = B.log.slice(0,4).map(l=>`<li class="${l.kind}">${esc(l.msg)}</li>`).join("");
  if(!B.connected()){
    return `<section class="panel bungie"><div class="row between"><div><h2>Bungie.net</h2>
      <p class="help" style="margin:4px 0 0">Connect your Bungie account and the app equips your run loadout in game, sets your subclass after every unlock, and logs finished activities for you.</p></div>
      <button class="btn primary" data-act="bLogin">Connect Bungie account</button></div>${logHtml?`<ul class="blog">${logHtml}</ul>`:""}</section>`;
  }
  const chars = B.chars||[];
  const cid = run ? B.pickChar(run) : null;
  const mine = run ? chars.filter(c=>c.cls===run.cls) : chars;
  const counts = run ? B.allowedCounts(run) : null;
  const countHtml = counts ? Object.entries(counts).map(([k,v])=>`<span class="chip ${v?"":"warn"}">${esc(cap(k))}: ${v}</span>`).join("") : "";
  const ago = B.lastSync ? Math.max(0,Math.round((Date.now()-B.lastSync)/60000)) : null;
  return `<section class="panel bungie">
    <div class="row between"><div><h2>Bungie.net · ${esc(B.account ? B.account.name : "connected")}</h2>
      <p class="help" style="margin:4px 0 0">${B.manifestState ? esc(B.manifestState) : run ? (mine.length ? "Playing on your "+run.cls+(mine.length>1?"":"")+"." : "No "+run.cls+" on this account.") : "Start a run and the app equips it on your matching character."}</p></div>
      <div class="row">
        ${run ? `<button class="btn primary" data-act="bApply" ${B.busy||!cid?"disabled":""}>${B.busy?"Working…":"Equip run loadout"}</button>
        <button class="btn" data-act="bSync" ${B.busy||!cid?"disabled":""}>Sync activities</button>
        <button class="btn" data-act="bClear" ${B.busy||!cid?"disabled":""} title="Moves weapons and armor on this character that aren't part of the run to your vault">Move other gear to vault</button>` : ""}
        <button class="btn ghost" data-act="bLogout">Disconnect</button>
      </div></div>
    ${run && mine.length>1 ? `<label class="field" for="bChar">Character<select id="bChar" name="bChar">${mine.map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.cls)} · ${c.light}</option>`).join("")}</select></label>` : ""}
    ${countHtml ? `<div><h3>Allowed gear you own</h3><div class="chips">${countHtml}</div></div>` : ""}
    ${run ? `<div class="row" style="gap:18px">
      <label class="tog"><input type="checkbox" id="bAutoEquip" ${B.opts.autoEquip?"checked":""}> Equip automatically after each reward</label>
      <label class="tog"><input type="checkbox" id="bAutoSync" ${B.opts.autoSync?"checked":""}> Sync automatically (checks every 20 seconds)</label>
      <span class="help">${run.difficulty==="hardcore"?"Hardcore: any death costs a life and the looted gear you had equipped.":"Normal: only failing or wiping out of an activity costs a life."}</span>
      ${ago!=null?`<span class="help">Last sync ${ago} min ago${run.queue&&run.queue.length?` · ${run.queue.length} waiting`:""}</span>`:""}
    </div>` : ""}
    ${logHtml?`<ul class="blog">${logHtml}</ul>`:""}
  </section>`;
}
let bRenderT = null;
window.renderBungieSoon = () => { clearTimeout(bRenderT); bRenderT = setTimeout(render, 50); };
async function bungieSync(quiet){
  const B = window.D2R_BUNGIE, run = state.run; if(!B || !run) return;
  B.pickChar(run);
  const n = await B.sync(run, {quiet});
  if(n){ processQueue(); save(); afterChange(); }
  render();
}
/* Fast sync: watch the current activity every 20 s (tiny request). When a counted activity ends,
   sync right away and retry while Bungie posts the result (usually 30-90 s). Full sync every 60 s as a backup. */
const RETRY_AFTER = [20000, 45000, 90000, 150000];
let retryTimers = [];
function syncSoon(){
  retryTimers.forEach(clearTimeout);
  retryTimers = RETRY_AFTER.map(ms=>setTimeout(async ()=>{
    const B = window.D2R_BUNGIE, run = state.run;
    if(!B || !run || run.status!=="active") return;
    const before = run.events.length + (run.queue||[]).length;
    await bungieSync(true);
    if(run.events.length + (run.queue||[]).length > before){ retryTimers.forEach(clearTimeout); retryTimers = []; }
  }, ms));
}
async function watchActivity(){
  const B = window.D2R_BUNGIE, run = state.run;
  if(!B || !B.connected() || !B.opts.autoSync || !run || run.status!=="active" || document.hidden) return;
  B.pickChar(run);
  const beforeDungeon = B.current && B.current.started, beforeLeft = B.justLeft;
  await B.pollCurrent(run);
  if(B.pendingOrbit && B.inOrbit && !B.busy){ B.note("You're in orbit: finishing your subclass changes…"); B.applyRun(run, {quiet:true}); }
  if(B.justLeft && B.justLeft !== beforeLeft){ B.note("Activity finished. Waiting for Bungie to post the result…"); syncSoon(); render(); }
  else if((B.current && B.current.started) !== beforeDungeon) render();
}
setInterval(watchActivity, 20000);
setInterval(()=>{ const B = window.D2R_BUNGIE; if(B && B.connected() && B.opts.autoSync && state.run && state.run.status==="active" && !document.hidden) bungieSync(true); }, 60000);
document.addEventListener("visibilitychange", ()=>{ const B = window.D2R_BUNGIE; if(!document.hidden && B && B.connected() && B.opts.autoSync && state.run && state.run.status==="active" && Date.now()-B.lastSync>30000){ bungieSync(true); watchActivity(); } });

/* ---------------- Events ---------------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act==="start") startRun();
  else if(act==="loot") takeLoot(parseInt(b.dataset.i,10));
  else if(act==="boon") takeBoon(parseInt(b.dataset.i,10));
  else if(act==="undo") undoLast();
  else if(act==="encounter") encounterCleared();
  else if(act==="bLogin") window.D2R_BUNGIE.login();
  else if(act==="bLogout") window.D2R_BUNGIE.logout();
  else if(act==="bApply"){ const B=window.D2R_BUNGIE; B.pickChar(state.run); B.applyRun(state.run); }
  else if(act==="bSync") bungieSync(false);
  else if(act==="bPull") window.D2R_BUNGIE.pullPostmaster(state.run);
  else if(act==="bClear"){ const B=window.D2R_BUNGIE; B.pickChar(state.run); B.clearToVault(state.run); }
  else if(act==="active") setActive(b.dataset.type, b.dataset.name);
  else if(act==="ask"){ ui.confirm=b.dataset.what; render(); }
  else if(act==="cancel"){ ui.confirm=null; render(); }
  else if(act==="extract"){ ui.confirm=null; endRun("extracted"); save(); render(); }
  else if(act==="abandon"){ ui.confirm=null; state.run.deaths++; state.run.lives=0; endRun("death"); save(); render(); }
  else if(act==="dismiss"){ state.run=null; save(); render(); }
  else if(act==="copy") copy(b.dataset.text);
  else if(act==="export") exportFile(b.dataset.kind);
  else if(act==="closeModal") $("#modal").innerHTML="";
  else if(act==="copyModal") copy($("#modalText").value);
});
document.addEventListener("change", e=>{
  const t = e.target;
  const B = window.D2R_BUNGIE;
  if(t.id==="bAutoEquip"){ B.opts.autoEquip = t.checked; B.saveOpts(); return; }
  if(t.id==="bAutoSync"){ B.opts.autoSync = t.checked; B.saveOpts(); return; }
  if(t.id==="bChar"){ B.charId = t.value; render(); return; }
  if(["cls","el","lives","mode","difficulty"].includes(t.name)){ ui.setup[t.name] = t.value; if(t.name!=="lives") render(); }
});
document.addEventListener("submit", e=>{
  if(e.target.id==="evform"){ e.preventDefault(); logEvent(e.target); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#modal").innerHTML) $("#modal").innerHTML=""; });

window.render = render; window.dimLoadout = dimLoadout; window.ELEMENTS = ELEMENTS;
render();
initCapabilities();
if(window.D2R_BUNGIE) window.D2R_BUNGIE.init().then(async ()=>{
  const B = window.D2R_BUNGIE, run = state.run;
  if(run && run.status==="active" && B.connected() && !run.ownedAtStart){ B.pickChar(run); try { await B.snapshot(run); save(); B.note("Loot tracking started: anything you pick up from now on is usable."); render(); } catch(e){} } if(state.run && state.run.status==="active" && window.D2R_BUNGIE.connected() && window.D2R_BUNGIE.opts.autoSync) bungieSync(true); });
</script>
</body>
</html>
